<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ngoc Linh 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml, <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"> <text y=".9em" font-size="80">💖</text> </svg>'>

  <style>
    * {
  border: none !important;
}

    html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;        /* chuẩn iPhone */
  overflow: hidden;      /* ❌ tắt scroll */
  touch-action: none;    /* ❌ chặn vuốt */
  background: #F2EEE3;
}

/* Page full màn hình */
.page {
 display: none;       /* tất cả ẩn */
  width: 100%;
  height: 100dvh;
  position: fixed;
  top: 0;
  left: 0;
  justify-content: center;
  align-items: center;
}

/* Page 1 hiện */
#page1 {
  display: flex;
}

/* Page 2 nền trắng */
#page2 {
  background: #fff;
  justify-content: center;    /* căn giữa ngang */
  align-items: center;
  /* display: flex; */
  flex-direction: column;
  text-align: center; 
}

/* Ảnh luôn fit màn hình */
.page img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* QR nhỏ lại 30% */
#page2 img {
   max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  display: block;
}

.scan-text {
  margin-top: 10px;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #333;
  animation: blink 1.2s infinite;
  font-family: 'Quicksand', sans-serif;
  text-align: center;
}

/* hiệu ứng nhấp nháy */
@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0.2; }
  100% { opacity: 1; }
}
  </style>
</head>
<body>

  <!-- PAGE 1 -->
  <div id="page1" class="page" onclick="nextPage()">
    <img src="DinnerParty_22032026.png" alt="Thiệp mời">
  </div>

  <!-- PAGE 2 -->
  <div id="page2" class="page">
    <img src="Ngoc Linh.png" alt="QR Code">
    <div class="scan-text">Scan to open 💌</div>
  </div>

  <script>
    function nextPage() {
      document.getElementById("page1").style.display = "none";
      document.getElementById("page2").style.display = "flex";
    }
  </script>

</body>
</html>
