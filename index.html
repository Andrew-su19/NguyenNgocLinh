<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ngoc Linh 💌</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml, <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"> <text y=".9em" font-size="80">💖</text> </svg>'>

  <style>
    html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;        /* chuẩn iPhone */
  overflow: hidden;      /* ❌ tắt scroll */
  touch-action: none;    /* ❌ chặn vuốt */
  background: #F2EEE3;
}

/* Page full màn hình */
.page {
 display: none;       /* tất cả ẩn */
  width: 100%;
  height: 100dvh;
  position: fixed;
  top: 0;
  left: 0;
  justify-content: center;
  align-items: center;
}

/* Page 1 hiện */
#page1 {
  display: flex;
}

/* Page 2 nền trắng */
#page2 {
  background: #fff;
  justify-content: center;    /* căn giữa ngang */
  align-items: center; 
}

/* Ảnh luôn fit màn hình */
.page img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* QR nhỏ lại 30% */
#page2 img {
   max-width: 70%;
  max-height: 70%;
  object-fit: contain;
  display: block;
}
  </style>
</head>
<body>

  <!-- PAGE 1 -->
  <div id="page1" class="page" onclick="nextPage()">
    <img src="DinnerParty_22032026.png" alt="Thiệp mời">
  </div>

  <!-- PAGE 2 -->
  <div id="page2" class="page">
    <img src="NgocLinh.png" alt="QR Code">
  </div>

  <script>
    function nextPage() {
      document.getElementById("page1").style.display = "none";
      document.getElementById("page2").style.display = "flex";
    }
  </script>

</body>
</html>
